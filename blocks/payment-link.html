<!-- ═══ Payment Link card (payment mockup) ════════════════════════════════════
     A shareable payment-request card with link + share chips. .epl in ds.css. -->
<section class="cmp payment-link surface-soft section-y" data-animate>
  <div class="container-ds flex justify-center" data-reveal="up">
    <div class="epl">
      <div class="epl-top"><span>Payment request</span><b>Emirates NBD Pay</b></div>
      <div class="epl-body">
        <div class="epl-lead">You&rsquo;ve been sent a secure request to pay</div>
        <div class="epl-amt">AED&nbsp;1,250.00</div>
        <div class="epl-link">pay.emiratesnbd.com/r/8x2k4q</div>
        <button class="epl-pay">Pay now</button>
        <div class="epl-share"><div class="epl-chip">WhatsApp</div><div class="epl-chip">SMS</div><div class="epl-chip">Email</div></div>
      </div>
    </div>
  </div>
</section>
