<!-- ═══ Cards — List (composition of cmp-cards, is-list layout) ══════════════
     The vertical LISTING: hairline rows, media-frame thumb at the start,
     title + subdescription stack, trailing arrow pushed to the end by the
     layout. A separate component from the accordion: rows navigate,
     nothing collapses. -->
<section class="cmp cmp-cards is-list cards-list surface-white section-y" data-animate>
  <div class="container-ds">
    <div class="section-head section-head-sm">
      <div class="ds-stack">
        <span class="ds-eyebrow ink-accent" data-reveal="up">Platforms</span>
        <h2 class="type-h2 ink-primary" data-reveal="up">Made to work the way you do.</h2>
      </div>
    </div>
    <div class="cd-grid" role="list">
      <a href="#" class="cd-card" role="listitem" aria-label="businessONLINE">
        <span class="media-frame aspect-square w-14 shrink-0"><span class="media-cover" data-bg="assets/images/image-1.jpg" aria-hidden="true"></span></span>
        <span class="ds-stack" style="--stack-gap: 2px"><span class="type-h6 block ink-primary">businessONLINE</span><span class="type-caption block ink-mute">Corporate banking platform</span></span>
        <span class="btn btn-text btn-icon is-arrow" aria-hidden="true"></span>
      </a>
      <a href="#" class="cd-card" role="listitem" aria-label="smartTRADE">
        <span class="media-frame aspect-square w-14 shrink-0"><span class="media-cover" data-bg="assets/images/image-3.jpg" aria-hidden="true"></span></span>
        <span class="ds-stack" style="--stack-gap: 2px"><span class="type-h6 block ink-primary">smartTRADE</span><span class="type-caption block ink-mute">Digital trade finance</span></span>
        <span class="btn btn-text btn-icon is-arrow" aria-hidden="true"></span>
      </a>
      <a href="#" class="cd-card" role="listitem" aria-label="Emirates NBD Pay">
        <span class="media-frame aspect-square w-14 shrink-0"><span class="media-cover" data-bg="assets/images/image-6.jpg" aria-hidden="true"></span></span>
        <span class="ds-stack" style="--stack-gap: 2px"><span class="type-h6 block ink-primary">Emirates NBD Pay</span><span class="type-caption block ink-mute">Merchant acquiring</span></span>
        <span class="btn btn-text btn-icon is-arrow" aria-hidden="true"></span>
      </a>
      <a href="#" class="cd-card" role="listitem" aria-label="Global Markets">
        <span class="media-frame aspect-square w-14 shrink-0"><span class="media-cover" data-bg="assets/images/image-5.jpg" aria-hidden="true"></span></span>
        <span class="ds-stack" style="--stack-gap: 2px"><span class="type-h6 block ink-primary">Global Markets</span><span class="type-caption block ink-mute">Rates, FX and commodities</span></span>
        <span class="btn btn-text btn-icon is-arrow" aria-hidden="true"></span>
      </a>
    </div>
  </div>
</section>
<!-- ═══ /Cards — List ═══════════════════════════════════════════════════════ -->
