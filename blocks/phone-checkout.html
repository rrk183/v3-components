<!-- ═══ Phone Checkout (payment mockup) ═══════════════════════════════════════
     A phone (dynamic island + home bar) showing a mobile checkout. .eph in ds.css. -->
<section class="cmp phone-checkout surface-soft section-y" data-animate>
  <div class="container-ds flex justify-center" data-reveal="up">
    <div class="eph">
      <div class="eph-screen">
        <div class="eph-note">Amount due</div>
        <div class="eph-amt">AED&nbsp;1,250.00</div>
        <div class="eph-line">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 4242</div>
        <button class="eph-pay">Pay AED&nbsp;1,250.00</button>
        <div class="eph-wal"><span>Apple&nbsp;Pay</span><span>Google&nbsp;Pay</span></div>
      </div>
    </div>
  </div>
</section>
