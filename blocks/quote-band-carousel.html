<!-- ═══ Quote Band — Carousel (rotating voices on the shared data-carousel core) ═
     The SAME band anatomy, several voices: full-width snap slides (media +
     figure per slide), pause toggle + glass arrows. Autoplay via
     data-autoplay (ms; drop to disable). -->
<section class="cmp cmp-quote-band is-carousel surface-primary section-y" data-animate>
  <div class="container-ds">
    <div class="qb-carousel" data-carousel data-autoplay="7000" aria-roledescription="carousel" aria-label="Client voices">
      <div class="qb-track" data-carousel-track>
      <div class="qb-slide" data-carousel-slide aria-roledescription="slide">
      <div class="qb-inner">
        <div class="qb-media" data-reveal="up">
          <span class="qb-img" data-bg="assets/images/shared/common/ib-ppl-e1.jpg" role="img" aria-label="Client leadership team"></span>
        </div>
        <figure class="qb-body" data-reveal="up" data-reveal-delay=".08">
          <span class="type-display-xxl bm-quote-mark qb-mark ink-accent-soft" aria-hidden="true">&ldquo;</span>
          <blockquote class="type-h3 qb-quote ink-white">Emirates NBD understood our business and moved at our pace — the partnership has changed how quickly we can act on an opportunity.</blockquote>
          <figcaption class="qb-cite">
            <span class="type-h5 ink-white">Aisha Al Marri</span>
            <span class="type-body-sm ink-soft">Group Treasurer, a UAE industrial group</span>
          </figcaption>
        </figure>
      </div>
      </div>
      <div class="qb-slide" data-carousel-slide aria-roledescription="slide">
      <div class="qb-inner">
        <div class="qb-media">
          <span class="qb-img" data-bg="assets/images/ib-ppl-l2.jpg" role="img" aria-label="Debt capital markets leadership"></span>
        </div>
        <figure class="qb-body">
          <span class="type-display-xxl bm-quote-mark qb-mark ink-accent-soft" aria-hidden="true">&ldquo;</span>
          <blockquote class="type-h3 qb-quote ink-white">Emirates NBD understood our business and moved at our pace — the partnership has changed how quickly we can act on an opportunity.</blockquote>
          <figcaption class="qb-cite">
            <span class="type-h5 ink-white">David Okoye</span>
            <span class="type-body-sm ink-soft">Head of DCM, Emirates NBD Capital</span>
          </figcaption>
        </figure>
      </div>
      </div>
      <div class="qb-slide" data-carousel-slide aria-roledescription="slide">
      <div class="qb-inner">
        <div class="qb-media">
          <span class="qb-img" data-bg="assets/images/ib-ppl-l3.jpg" role="img" aria-label="Treasury leadership"></span>
        </div>
        <figure class="qb-body">
          <span class="type-display-xxl bm-quote-mark qb-mark ink-accent-soft" aria-hidden="true">&ldquo;</span>
          <blockquote class="type-h3 qb-quote ink-white">Emirates NBD understood our business and moved at our pace — the partnership has changed how quickly we can act on an opportunity.</blockquote>
          <figcaption class="qb-cite">
            <span class="type-h5 ink-white">Fatima Hassan</span>
            <span class="type-body-sm ink-soft">Group Treasurer, regional retail group</span>
          </figcaption>
        </figure>
      </div>
      </div>
      </div>
      <div class="qb-ctrls">
        <button class="crl-toggle" type="button" data-carousel-toggle hidden aria-label="Pause"><span class="crl-ic-pause" aria-hidden="true"></span><span class="crl-ic-play" aria-hidden="true"></span></button>
        <button type="button" class="btn btn-glass btn-icon btn-pill is-back" data-carousel-prev><span class="sr-only">Previous quote</span></button>
        <button type="button" class="btn btn-glass btn-icon btn-pill is-next" data-carousel-next><span class="sr-only">Next quote</span></button>
      </div>
    </div>
  </div>
</section>
<!-- ═══ /Quote Band — Carousel ══════════════════════════════════════════════ -->
