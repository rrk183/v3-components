<!-- ═══ Cards — Testimonials (composition of cmp-cards) ═══
     The estate pattern: clean media card, the quote BELOW on the surface,
     author + case-study link row. Carousel variant = center-peek. -->
<section class="cmp cmp-cards is-hover-zoom cards-testimonials is-cols-2 surface-white section-y" data-animate>
  <div class="container-ds">
    <div class="section-head-sm is-center">
      <div class="ds-stack"><span class="ds-eyebrow ink-accent" data-reveal="up">Testimonials</span><h2 class="type-h2 ink-primary" data-reveal="up">See how we've helped businesses like yours succeed through our clients' experiences.</h2></div>
    </div>
    <div class="cd-grid" role="list">
      <figure class="cd-card m-0" role="listitem" data-reveal="up" data-reveal-delay=".04">
        <span class="media-frame aspect-[16/10]"><span class="media-cover" data-bg="assets/images/image-1.jpg" aria-hidden="true"></span></span>
        <blockquote class="type-h5 m-0 mt-6 ink-primary">&ldquo;Managing cash across 14 entities in 6 countries used to take a team. businessONLINE reduced that to one dashboard — and one login.&rdquo;</blockquote>
        <figcaption class="flex items-center justify-between w-full mt-4">
          <span class="type-body-sm ink-mute">Khalid Al Rashidi</span>
          <span class="btn btn-text btn-sm is-arrow">Read case study
           </span>
        </figcaption>
      </figure>
      <figure class="cd-card m-0" role="listitem" data-reveal="up" data-reveal-delay=".14">
        <span class="media-frame aspect-[16/10]"><span class="media-cover" data-bg="assets/images/image-2.jpg" aria-hidden="true"></span></span>
        <blockquote class="type-h5 m-0 mt-6 ink-primary">&ldquo;Our treasury team processes cross-border payments in under two minutes. That used to take half a day. The difference is businessONLINE.&rdquo;</blockquote>
        <figcaption class="flex items-center justify-between w-full mt-4">
          <span class="type-body-sm ink-mute">Fatima Al Zarouni</span>
          <span class="btn btn-text btn-sm is-arrow">Read case study
           </span>
        </figcaption>
      </figure>
      <figure class="cd-card m-0" role="listitem" data-reveal="up" data-reveal-delay=".24">
        <span class="media-frame aspect-[16/10]"><span class="media-cover" data-bg="assets/images/image-3.jpg" aria-hidden="true"></span></span>
        <blockquote class="type-h5 m-0 mt-6 ink-primary">&ldquo;The trade finance capability gave us the confidence to move into three new corridors in under six months. That pace would not have been possible otherwise.&rdquo;</blockquote>
        <figcaption class="flex items-center justify-between w-full mt-4">
          <span class="type-body-sm ink-mute">James Whitfield</span>
          <span class="btn btn-text btn-sm is-arrow">Read case study
           </span>
        </figcaption>
      </figure>
      <figure class="cd-card m-0" role="listitem" data-reveal="up" data-reveal-delay=".34">
        <span class="media-frame aspect-[16/10]"><span class="media-cover" data-bg="assets/images/image-4.jpg" aria-hidden="true"></span></span>
        <blockquote class="type-h5 m-0 mt-6 ink-primary">&ldquo;We onboarded 40 subsidiaries onto one platform in a quarter. The visibility our board gets now simply did not exist before.&rdquo;</blockquote>
        <figcaption class="flex items-center justify-between w-full mt-4">
          <span class="type-body-sm ink-mute">Meera Nair</span>
          <span class="btn btn-text btn-sm is-arrow">Read case study
           </span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>
