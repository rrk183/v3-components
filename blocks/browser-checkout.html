<!-- ═══ Browser Checkout (payment mockup) ═════════════════════════════════════
     A browser window with an embedded checkout on a representative store.
     .ebrowser in ds.css. -->
<section class="cmp browser-checkout surface-soft section-y" data-animate>
  <div class="container-ds flex justify-center" data-reveal="up">
    <div class="ebrowser">
      <div class="ebr-bar"><i></i><i></i><i></i><span class="ebr-url">www.auroraliving.ae/checkout</span></div>
      <div class="ebr-body">
        <div class="ebr-site">
          <div class="ebr-shot" data-bg="/assets/images/image-3.jpg"></div>
          <h4>Aurora Lounge Chair</h4>
          <div class="pr">Walnut &middot; 1 item</div>
          <div class="ebr-row"><span>Subtotal</span><span>AED&nbsp;1,190.00</span></div>
          <div class="ebr-row"><span>Delivery</span><span>AED&nbsp;60.00</span></div>
          <div class="ebr-row tot"><span>Total</span><span>AED&nbsp;1,250.00</span></div>
        </div>
        <div class="ebr-co">
          <span class="emb"></span><span class="tag">EMBEDDED</span>
          <div class="lab">Pay with card</div>
          <div class="amt">AED&nbsp;1,250.00</div>
          <div class="ebr-fld"><span>&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 4242</span><b>VISA</b></div>
          <div class="ebr-fld"><span>12 / 27</span><span>&bull;&bull;&bull;</span></div>
          <button class="ebr-pay">Pay AED&nbsp;1,250.00</button>
          <div class="ebr-pwr">&#128274; Powered by Emirates NBD Pay</div>
        </div>
      </div>
    </div>
  </div>
</section>
