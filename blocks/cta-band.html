<!-- ═══ CTA Band ═══════════════════════════════════════════════════════════════
     Centred call-to-action band on a navy surface: eyebrow + big headline + lead
     + a single CTA. Styled by .ptf-ctaband / .ptf-ctarow in ds.css. -->
<section class="cmp ptf-ctaband surface-primary section-y" data-animate>
  <div class="container-narrow">
    <span class="ds-eyebrow ink-accent-soft" data-reveal="up">Talk to us</span>
    <h2 class="type-h1 ink-white" data-reveal="up" data-reveal-delay=".05">Let&rsquo;s get you accepting payments.</h2>
    <p class="type-body-lg measure mx-auto ink-soft" data-reveal="up" data-reveal-delay=".1">Tell us about your business and our team will get you set up &mdash; in store, online and on the go.</p>
    <div class="ptf-ctarow" data-reveal="up" data-reveal-delay=".15">
      <a class="btn btn-primary" href="#">Contact us &rarr;</a>
    </div>
  </div>
</section>
