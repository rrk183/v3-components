<!-- ═══ Checkout Card (payment mockup) ════════════════════════════════════════
     A hosted-checkout card mockup: amount, card field, pay button + wallets.
     Pure markup, styled by .epc in ds.css. No recipe. -->
<section class="cmp checkout-card surface-soft section-y" data-animate>
  <div class="container-ds flex justify-center" data-reveal="up">
    <div class="epc">
      <div class="epc-top"><span>Emirates NBD Pay</span><b>Secure checkout</b></div>
      <div class="epc-body">
        <div class="epc-amt"><small>Amount due</small><span class="v">AED&nbsp;1,250.00</span></div>
        <div class="epc-field"><span class="dots">&bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; &bull;&bull;&bull;&bull; 4242</span><span>VISA</span></div>
        <div class="epc-2"><div class="epc-field"><span>12 / 27</span></div><div class="epc-field"><span class="dots">&bull;&bull;&bull;</span></div></div>
        <button class="epc-pay">Pay AED&nbsp;1,250.00</button>
        <div class="epc-or">or pay with</div>
        <div class="epc-wallets"><div class="epc-wallet">Apple&nbsp;Pay</div><div class="epc-wallet">Google&nbsp;Pay</div></div>
      </div>
    </div>
  </div>
</section>
