<!-- ═══ Logo Wall — Marquee ═══════════════════════════════════════════
     Params: surface (surface-white|grey…), data-animate (on/off).
     Pure markup — NO inline styles. Styled by .cmp-logo-wall-marquee.
     Marquee is pure-CSS keyframe scroll (no JS), paused on hover.
     Strip is duplicated 2× for a seamless loop (translateX -50%). -->

    </div>
  </div>

  <div class="tpm-outer marquee" data-reveal="up" data-reveal-delay=".12">
    <div class="tpm-strip marquee-track">
