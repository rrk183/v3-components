<!-- ═══ Big Statement ═══════════════════════════════════════════════════════
     Apple-style opening editorial line. Centered narrow column on any surface.
     Alignment rides the section-head variant system (as built: .is-center;
     remove it for left, or use .is-split) — never a text-center utility on
     the wrapper, which would pin every variant to centred.
     Params: surface (surface-white|grey|navy…), data-animate (on/off).
     Pure markup — NO inline styles, NO IDs. Styled by .cmp-big-statement in
     ds.css, animated by ds.js. Oversized headline weight is intentionally
     regular (400); the emphasised word is blue. -->
<section class="cmp cmp-big-statement surface-white section-y" data-animate>
  <div class="container-narrow">

    <div class="section-head is-center">
      <div class="ds-stack">
        <span class="ds-eyebrow ink-accent" data-reveal="up">Corporate &amp; Institutional Banking</span>
        <h2 class="bst-line type-display-xxl ink-primary" data-reveal><span class="bst-l"><span class="bst-w">Capital,</span></span><span class="bst-l"><span class="bst-w">in <em>motion.</em></span></span></h2>
      </div>
      <p class="bst-sub type-body-lg sh-lead ink-mute" data-reveal="up" data-reveal-delay=".12">Everything a business needs to move money, manage risk and fund what's next — on one platform, backed by the region's anchor bank.</p>
    </div>

    <a href="#" class="btn btn-text btn-lg bst-link" data-reveal="up" data-reveal-delay=".18">See what's possible →</a>

  </div>
</section>
<!-- ═══ /Big Statement ═══════════════════════════════════════════════════════ -->
