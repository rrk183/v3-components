<!-- ═══ Hero — Editorial (cmp-hero v4 composition) ═══════════════════════════
     The editorial-story anatomy on the one hero: display-XL headline pinned
     low + a countup stat strip under a hairline — the extras slot is pure
     composition (utilities + ds-num + data-countup). -->
<section class="cmp cmp-hero is-bottom surface-primary" data-animate>
  <div class="hero-stage surface-image">
    <span class="media-cover" data-bg="/assets/images/sustainability.jpg" aria-hidden="true"></span>
    <span class="ov ov-dark ov-gradient-b ov-80" aria-hidden="true"></span>
    <div class="container-ds hero-frame">
      <div class="w-full">
        <div class="hero-copy ds-stack" style="--hero-copy-max: 56rem">
          <span class="ds-eyebrow ink-white" data-reveal="up">Sustainability</span>
          <h1 class="type-display-xl ink-white" data-reveal="up" data-reveal-delay=".12">Banking a<br>sustainable future.</h1>
          <p class="type-body-lg measure ink-soft" data-reveal="up" data-reveal-delay=".26">Directing capital where it matters most &mdash; financing the region&rsquo;s transition to a low-carbon economy.</p>
        </div>
        <div class="flex flex-wrap gap-x-14 gap-y-6 mt-12 pt-8 border-t border-ink" data-reveal="up" data-reveal-delay=".42">
          <div class="ds-stack" style="--ds-stack-gap: 2px"><span class="ds-num is-light ink-white">AED&nbsp;<span data-countup="30">30</span><span class="u">bn</span></span><span class="type-caption ink-soft">Green financing by 2030</span></div>
          <div class="ds-stack" style="--ds-stack-gap: 2px"><span class="ds-num is-light ink-white"><span data-countup="60">60</span><span class="u">%</span></span><span class="type-caption ink-soft">Emissions cut across operations</span></div>
          <div class="ds-stack" style="--ds-stack-gap: 2px"><span class="ds-num is-light ink-white"><span data-countup="12">12</span><span class="u">+</span></span><span class="type-caption ink-soft">Sustainability-linked frameworks</span></div>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- ═══ /Hero — Editorial ═══════════════════════════════════════════════════ -->
