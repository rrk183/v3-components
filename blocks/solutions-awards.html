<!-- ═══ Solutions & Awards ══════════════════════════════════════════════════
     Params: surface (surface-white|grey|navy…), data-animate (on/off).
     Pure markup — NO inline styles, NO IDs. Styled by .cmp-solutions-awards in
     ds.css, animated by ds.js. Award logos are greyscale by default and colour
     on hover; "See all awards" link nudges its arrow on hover. -->
<section class="cmp cmp-solutions-awards surface-white section-y" data-animate>
  <div class="container-ds">

    <!-- Section header: heading left + description right (switchable variant) -->
    <div class="section-head is-split">
      <div class="ds-stack">
        <h2 class="type-h2 font-semibold ink-primary" data-reveal="up">
          Unlock new possibilities with our comprehensive range of solutions.
        </h2>
      </div>
      <p class="type-body sh-lead ink-mute" data-reveal="up" data-reveal-delay=".12">
        From Investment Banking to Treasury Services, we offer a full suite of customizable and accessible financial products to help you achieve your goals.
      </p>
    </div>

    <!-- Award logos: 1/row mobile · wrap centred tablet · single row desktop -->
    <div class="flex flex-col items-center gap-y-10 mb-16
                md:flex-row md:flex-wrap md:justify-center md:items-center md:gap-x-10 md:gap-y-10
                xl:flex-nowrap xl:justify-between">

      <!-- 1. Euromoney -->
      <div class="sa-logo sa-logo-1 flex items-center justify-center shrink-0" data-reveal="up" data-reveal-delay=".12">
        <svg viewBox="0 0 220 110" fill="none" xmlns="http://www.w3.org/2000/svg" class="sa-logo-fill">
          <circle cx="178" cy="55" r="40" stroke="#c0392b" stroke-width="1.2" fill="none"/>
          <ellipse cx="178" cy="55" rx="22" ry="40" stroke="#c0392b" stroke-width="1.2" fill="none"/>
          <ellipse cx="178" cy="55" rx="40" ry="14" stroke="#c0392b" stroke-width="1.2" fill="none"/>
          <line x1="138" y1="55" x2="218" y2="55" stroke="#c0392b" stroke-width="1.2"/>
          <line x1="178" y1="15" x2="178" y2="95" stroke="#c0392b" stroke-width="1.2"/>
          <text x="4" y="36" font-family="Arial Black, sans-serif" font-size="19" font-weight="900" fill="#1a1a2e" letter-spacing="0.5">EUROMONEY</text>
          <text x="4" y="52" font-family="Arial, sans-serif" font-size="7.5" fill="#444" letter-spacing="1">AWARDS FOR EXCELLENCE</text>
          <text x="4" y="78" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#c0392b">2024</text>
        </svg>
      </div>

      <!-- 2. Bonds, Loans & Sukuk -->
      <div class="sa-logo sa-logo-2 flex items-center justify-center shrink-0" data-reveal="up" data-reveal-delay=".20">
        <svg viewBox="0 0 240 90" fill="none" xmlns="http://www.w3.org/2000/svg" class="sa-logo-fill">
          <path d="M 8 70 Q 28 20 58 35 Q 38 50 8 70 Z" fill="#4a90d9" opacity="0.9"/>
          <path d="M 8 70 Q 40 30 70 50 Q 50 60 8 70 Z" fill="#2765FF" opacity="0.8"/>
          <path d="M 8 70 Q 48 40 78 60 Q 58 68 8 70 Z" fill="#072447" opacity="0.9"/>
          <text x="88" y="36" font-family="Arial, sans-serif" font-size="12" fill="#555" letter-spacing="0.3">Bonds, Loans &amp; Sukuk</text>
          <text x="88" y="56" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#072447" letter-spacing="0.5">MIDDLE EAST</text>
          <text x="88" y="74" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#072447" letter-spacing="0.5">AWARDS</text>
        </svg>
      </div>

      <!-- 3. The Banker -->
      <div class="sa-logo sa-logo-3 flex items-center justify-center shrink-0" data-reveal="up" data-reveal-delay=".28">
        <svg viewBox="0 0 200 90" fill="none" xmlns="http://www.w3.org/2000/svg" class="sa-logo-fill">
          <rect x="0" y="0" width="5" height="90" fill="#c0392b"/>
          <text x="16" y="30" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#1a1a2e" letter-spacing="0.3">THE</text>
          <text x="16" y="54" font-family="Arial Black, sans-serif" font-size="20" font-weight="900" fill="#1a1a2e" letter-spacing="0.3">BANKER</text>
          <text x="16" y="72" font-family="Arial, sans-serif" font-size="7.5" fill="#555" letter-spacing="1.2">TECHNOLOGY AWARDS 2024</text>
        </svg>
      </div>

      <!-- 4. EMEA Finance -->
      <div class="sa-logo sa-logo-4 flex items-center justify-center shrink-0" data-reveal="up" data-reveal-delay=".12">
        <svg viewBox="0 0 190 90" fill="none" xmlns="http://www.w3.org/2000/svg" class="sa-logo-fill">
          <polygon points="20,8 24,20 20,18 16,20" fill="#1a6bb5"/>
          <polygon points="20,32 16,20 20,22 24,20" fill="#1a6bb5" opacity="0.5"/>
          <polygon points="8,20 20,16 18,20 20,24" fill="#1a6bb5" opacity="0.7"/>
          <polygon points="32,20 20,24 22,20 20,16" fill="#1a6bb5" opacity="0.4"/>
          <circle cx="20" cy="20" r="4" fill="#1a6bb5"/>
          <text x="42" y="18" font-family="Arial Black, sans-serif" font-size="17" font-weight="900" fill="#1a6bb5" letter-spacing="0.5">EMEA</text>
          <text x="42" y="36" font-family="Arial Black, sans-serif" font-size="17" font-weight="900" fill="#1a1a2e" letter-spacing="0.5">FINANCE</text>
          <line x1="0" y1="50" x2="190" y2="50" stroke="#1a6bb5" stroke-width="0.8" opacity="0.4"/>
          <text x="0" y="66" font-family="Arial, sans-serif" font-size="7.5" fill="#555" letter-spacing="1.2">ACHIEVEMENT AWARDS 2024</text>
        </svg>
      </div>

      <!-- 5. GTR (Global Trade Review) -->
      <div class="sa-logo sa-logo-5 flex items-center justify-center shrink-0" data-reveal="up" data-reveal-delay=".20">
        <svg viewBox="0 0 170 90" fill="none" xmlns="http://www.w3.org/2000/svg" class="sa-logo-fill">
          <text x="0" y="52" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#e8702a" letter-spacing="-2">GTR</text>
          <rect x="0" y="56" width="115" height="2.5" fill="#e8702a"/>
          <text x="0" y="72" font-family="Arial, sans-serif" font-size="7" fill="#333" letter-spacing="1">GLOBAL TRADE REVIEW</text>
          <text x="0" y="84" font-family="Arial, sans-serif" font-size="7" fill="#555" letter-spacing="1">MIDDLE EAST AWARDS 2024</text>
        </svg>
      </div>

    </div>

    <!-- See all awards link -->
    <a href="#" class="btn btn-text is-arrow" data-reveal="left" data-reveal-delay=".30">
      See all awards
    </a>

  </div>
</section>
