<!-- ═══ Scroll Story — Video Scrub (declarative) ════════════════════════════
     scroll-story-scrub: a pinned VIDEO background that scrubs by scroll
     (currentTime ← progress) with declarative data-anim text beats over it.
     Same authoring contract as scroll-story (data-anim keyframes), plus
     data-source="video" + a <video data-story-video>. surface-primary. -->
<section class="cmp cmp-scroll-story-video surface-primary" data-animate>
  <div class="ssv" data-behavior="scroll-story-scrub" data-scrub-vh="520" data-source="video">
    <div class="ssv-stage surface-image">
      <video class="ssv-video" data-story-video src="/assets/videos/hero-video.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
      <div class="ov ov-dark ov-gradient-b ov-60"></div>

      <div class="ssv-caps">
        <!-- Beat 1 -->
        <div class="ssv-cap" data-anim='{"0-0.16":{"y":[54,0],"opacity":[0,1],"blur":[12,0]},"0.26-0.38":{"opacity":[1,0],"y":[0,-44],"blur":[0,12]}}'>
          <span class="ds-eyebrow ink-white">Trade Finance</span>
          <h2 class="type-display-lg ssv-h ink-white">Capital that moves<br>with you.</h2>
        </div>
        <!-- Beat 2 -->
        <div class="ssv-cap" data-anim='{"0.4-0.56":{"y":[54,0],"opacity":[0,1],"scale":[0.92,1]},"0.66-0.78":{"opacity":[1,0],"scale":[1,0.95],"y":[0,-30]}}'>
          <span class="ds-eyebrow ink-white">180+ markets</span>
          <h2 class="type-display-lg ssv-h ink-white">Settle anywhere,<br>with certainty.</h2>
        </div>
        <!-- Beat 3 -->
        <div class="ssv-cap" data-anim='{"0.8-0.94":{"y":[54,0],"opacity":[0,1],"blur":[10,0]}}'>
          <span class="ds-eyebrow ink-white">Ready to move?</span>
          <h2 class="type-display-lg ssv-h ink-white">Let&rsquo;s get started.</h2>
          <a href="#" class="btn btn-filled btn-lg ssv-cta">Talk to trade desk →</a>
        </div>
      </div>
    </div>
  </div>
</section>
<!-- ═══ /Scroll Story — Video Scrub ══════════════════════════════════════════ -->
