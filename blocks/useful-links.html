<!-- ═══ Useful Links — resource-row grid ═══════════════════════════════════════
     A categorized resources strip for the foot of a page: a ds-eyebrow head
     over a columned grid of hairline link ROWS. Each row = title, optional
     .ul-meta line, and a type glyph that says what clicking does:
     arrow = page, download = PDF (meta carries "PDF · size"), up-right =
     external (meta carries the domain). Optional leading .icon-tile is-sm
     mark — icons ALL-OR-NONE per instance (mixed rows misalign titles).
     Columns: default 3; is-cols-1 / is-cols-2 / is-cols-3 on the root
     (--ul-cols). Pure markup — NO inline styles, NO IDs, NO inline script.
     Styled by .cmp-useful-links in ds.css (surface-adaptive .ul-*),
     reveal-animated by ds.js. -->
